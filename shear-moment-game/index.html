<title>Beam Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one blueprint drafting sheet; HUD strip on top, a level track, then the active "drawing" card. Single deliberate dark blueprint world. */
:root{color-scheme:dark;
--bg:#0b1f3a;--bg2:#0f2a4d;--card:#10294a;--ink:#e6f1ff;--mute:#8fb0d6;--line:#2c5583;
--beam:#1b4472;--beamline:#7fd4ff;--acc:#4fd1ff;--good:#3ee08f;--bad:#ff5d73;--v:#4fd1ff;--m:#ffb547;
--f-display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 var(--f-body);
background-color:var(--bg);
background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px),linear-gradient(rgba(79,209,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,209,255,.06) 1px,transparent 1px);
background-size:100px 100px,100px 100px,20px 20px,20px 20px;min-height:100%}
main{max-width:880px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--acc);padding-bottom:10px}
h1{font:700 clamp(1.7rem,5vw,2.4rem)/1 var(--f-display);margin:0;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 18px rgba(79,209,255,.45)}
h1 small{display:block;font:500 .72rem var(--f-mono);letter-spacing:.18em;color:var(--mute);text-shadow:none;margin-bottom:6px}
.hud{display:flex;gap:8px}
.pill{font:600 .95rem var(--f-mono);border:1px solid var(--line);background:rgba(16,41,74,.8);padding:6px 12px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.pill i{font-style:normal;font-size:.7rem;color:var(--mute);letter-spacing:.1em}
.pill.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.18);border-color:var(--good)}}
.track{display:flex;gap:4px;margin:16px 0}
.track span{flex:1;height:8px;background:var(--line);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .3s}
.track span.done{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.track span.now{background:var(--m)}
#bar{display:none}.progress{display:none}
.card{position:relative;background:rgba(16,41,74,.92);border:1px solid var(--line);padding:22px;margin-bottom:14px;animation:in .35s ease-out;backdrop-filter:blur(2px)}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc)}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
@keyframes in{from{opacity:.4;transform:translateY(8px)}}
.step{font:500 .75rem var(--f-mono);color:var(--m);letter-spacing:.16em;text-transform:uppercase}
h2{font:700 1.45rem/1.2 var(--f-display);margin:.2em 0 .6em;text-wrap:balance}
p,li{max-width:68ch}
.eq{font-family:var(--f-mono);background:rgba(4,15,30,.6);border-left:3px solid var(--acc);padding:10px 14px;margin:12px 0;overflow-x:auto;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
button{font:600 1rem var(--f-body);cursor:pointer;border:1px solid var(--line);background:rgba(4,15,30,.5);color:var(--ink);padding:11px 12px;transition:transform .12s,border-color .12s,box-shadow .12s}
button:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 14px rgba(79,209,255,.3);transform:translateY(-1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--m);outline-offset:2px}
button.right{background:var(--good);color:#04210f;border-color:var(--good);animation:pop .4s}
button.wrong{background:transparent;color:var(--bad);border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button.primary{background:var(--acc);color:#04182d;border-color:var(--acc);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
button:disabled{opacity:.55;cursor:default}
button.right:disabled{opacity:1}
.fb{margin-top:12px;min-height:1.5em}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
svg{width:100%;height:auto;display:block}
.beam{fill:var(--beam);stroke:var(--beamline);stroke-width:2}
.txt{fill:var(--ink);font:14px var(--f-mono)}
.vline{stroke:var(--v);stroke-width:3;fill:none;filter:drop-shadow(0 0 4px var(--v))}
.mline{stroke:var(--m);stroke-width:3;fill:none;filter:drop-shadow(0 0 4px var(--m))}
.axis{stroke:var(--mute);stroke-width:1}
.cut{stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4}
input[type=range]{width:100%;accent-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-family:var(--f-mono)}
td,th{border:1px solid var(--line);padding:6px;text-align:center}
th{color:var(--mute);font-weight:500}
td input,select{width:5.5em;font:inherit;padding:5px;border:1px solid var(--line);background:rgba(4,15,30,.6);color:var(--ink);text-align:center}
select{width:auto}
td input.ok{border-color:var(--good);box-shadow:0 0 8px var(--good)}
td input.no{border-color:var(--bad);box-shadow:0 0 8px var(--bad)}
.hint{color:var(--mute);font-size:.92rem}
code{font-family:var(--f-mono);color:var(--m)}
.live{display:flex;gap:16px;flex-wrap:wrap;font:600 1.05rem var(--f-mono);margin:8px 0}
.float{position:fixed;font:700 1.3rem var(--f-display);color:var(--good);pointer-events:none;animation:up .9s ease-out forwards;z-index:9;text-shadow:0 0 10px var(--good)}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main>
<header>
  <h1><small>ENGR 057 · WORKSHEET 11</small>Beam Quest</h1>
  <div class="hud"><span class="pill" id="xpp"><i>XP</i><span id="xp">0</span></span><span class="pill" id="stp"><i>STREAK</i><span id="streak">0</span></span></div>
</header>
<div class="progress"><div id="bar"></div></div><div class="track" id="track"></div>
<div id="stage"></div>
</main>

<script>
/* ---------- state ---------- */
let xp=0, streak=0, level=0;
const $=s=>document.querySelector(s);
const stage=$("#stage");
function award(ok){ if(ok){streak++;xp+=10+5*Math.min(streak,5);} else streak=0; $("#xp").textContent=xp; $("#streak").textContent=streak;
  if(ok){ const p=$("#xpp"); p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
    const r=p.getBoundingClientRect(), f=document.createElement("div"); f.className="float"; f.textContent="+"+(10+5*Math.min(streak,5)); f.style.left=r.left+"px"; f.style.top=(r.bottom+4)+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),950); } }

/* ---------- beam drawing (problem 1: length 2L, P at L) ---------- */
// x in units of L. W = drawing width.
const W=640, X0=50, SC=270; // 2L -> 540px
const px=x=>X0+x*SC;

function beamSVG({cut=null, showReactions=false, leftOnly=false}={}){
  let s=`<svg viewBox="0 0 ${W} 200">`;
  s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="context-stroke"/></marker></defs>`;
  const end = leftOnly&&cut!=null ? cut : 2;
  s+=`<rect class="beam" x="${px(0)}" y="80" width="${px(end)-px(0)}" height="30"/>`;
  // supports
  s+=`<polygon points="${px(0)},110 ${px(0)-16},135 ${px(0)+16},135" fill="var(--line)" stroke="var(--beamline)"/>`;
  if(!leftOnly) s+=`<circle cx="${px(2)}" cy="123" r="13" fill="var(--line)" stroke="var(--beamline)"/>`;
  // load P
  if(!leftOnly || cut>1){
    s+=`<g style="color:var(--ink)"><line x1="${px(1)}" y1="20" x2="${px(1)}" y2="76" stroke="currentColor" stroke-width="3" marker-end="url(#ah)"/></g><text class="txt" x="${px(1)+8}" y="32" font-weight="700">P</text>`;
  }
  // reactions
  if(showReactions){
    s+=`<g style="color:var(--good)"><line x1="${px(0)}" y1="190" x2="${px(0)}" y2="140" stroke="currentColor" stroke-width="3" marker-end="url(#ah)"/></g><text class="txt" x="${px(0)+8}" y="180" fill="var(--good)">A<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = P/2</tspan></text>`;
    if(!leftOnly) s+=`<g style="color:var(--good)"><line x1="${px(2)}" y1="190" x2="${px(2)}" y2="140" stroke="currentColor" stroke-width="3" marker-end="url(#ah)"/></g><text class="txt" x="${px(2)-110}" y="180">B<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = P/2</tspan></text>`;
  }
  // cut + internal forces
  if(cut!=null){
    s+=`<line class="cut" x1="${px(cut)}" y1="60" x2="${px(cut)}" y2="130"/>`;
    if(leftOnly){
      s+=`<g style="color:var(--v)"><line x1="${px(cut)+6}" y1="60" x2="${px(cut)+6}" y2="105" stroke="currentColor" stroke-width="3" marker-end="url(#ah)"/></g><text class="txt" x="${px(cut)+12}" y="70" fill="var(--v)" font-weight="700" style="fill:var(--v)">V</text>`;
      s+=`<path d="M${px(cut)+24},120 A22,22 0 0 0 ${px(cut)+24},72" stroke="var(--m)" stroke-width="3" fill="none" marker-end="url(#ah)" style="color:var(--m)"/><text x="${px(cut)+36}" y="125" style="fill:var(--m);font:700 14px system-ui">M</text>`;
    }
  }
  s+=`<text class="txt" x="${px(0)-4}" y="155">0</text><text class="txt" x="${px(1)-6}" y="155">L</text><text class="txt" x="${px(2)-10}" y="155">2L</text>`;
  return s+`</svg>`;
}

/* V and M diagrams from piecewise functions; f(x) returns value in units of P (V) or PL (M) */
function diagSVG(f, cls, label, xmax=2, cut=null, upto=null){
  const H=150, mid=75, k=110; // k px per unit
  const sc=(x)=>X0+x*(540/xmax);
  let pts=[]; const end = upto==null?xmax:upto;
  for(let i=0;i<=400;i++){ const x=i/400*end; pts.push([sc(x), mid - f(x)*k*(xmax==2?1:0.9)]); }
  // insert vertical jumps by drawing polyline as-is (fine resolution shows jumps)
  let s=`<svg viewBox="0 0 ${W} ${H}"><line class="axis" x1="${X0}" y1="${mid}" x2="${X0+550}" y2="${mid}"/><line class="axis" x1="${X0}" y1="10" x2="${X0}" y2="${H-10}"/>`;
  s+=`<text x="10" y="20" style="fill:var(--${cls[0]});font:700 16px system-ui">${label}</text>`;
  for(let i=1;i<=xmax;i++) s+=`<line class="axis" x1="${sc(i)}" y1="${mid-5}" x2="${sc(i)}" y2="${mid+5}"/><text class="txt" x="${sc(i)-6}" y="${mid+22}" font-size="12">${i==1?'L':i+'L'}</text>`;
  s+=`<polyline class="${cls}" points="${[[X0,mid],...pts].map(p=>p.join(',')).join(' ')}"/>`;
  if(cut!=null) s+=`<line class="cut" x1="${sc(cut)}" y1="10" x2="${sc(cut)}" y2="${H-10}"/>`;
  return s+`</svg>`;
}
const V1=x=> x<1? .5 : (x<2? -.5 : 0);
const M1=x=> x<=1? .5*x : -.5*x+1;

/* ---------- reusable multiple-choice ---------- */
function mcq(container, q, opts, correctIdx, explain, onDone){
  const box=document.createElement("div");
  box.innerHTML=`<p>${q}</p><div class="choices"></div><div class="fb"></div>`;
  const ch=box.querySelector(".choices"), fb=box.querySelector(".fb");
  let tried=false;
  opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.innerHTML=o;
    b.onclick=()=>{
      if(i===correctIdx){
        b.classList.add("right"); award(!tried);
        fb.className="fb good"; fb.innerHTML=""+explain;
        ch.querySelectorAll("button").forEach(x=>x.disabled=true);
        onDone&&onDone();
      } else { tried=true; award(false); b.classList.add("wrong"); b.disabled=true; fb.className="fb bad"; fb.textContent="Not quite — try again."; }
    };
    ch.appendChild(b);
  });
  container.appendChild(box);
}
function nextBtn(container, label="Next level"){
  const b=document.createElement("button"); b.className="primary"; b.textContent=label; b.style.marginTop="12px";
  b.onclick=()=>go(level+1); container.appendChild(b);
}
function chain(card, qs){ // run questions one at a time, then Next button
  let i=0; const run=()=>{ if(i>=qs.length) return nextBtn(card); const q=qs[i++]; mcq(card,q[0],q[1],q[2],q[3],run); }; run();
}

/* ---------- levels ---------- */
const levels=[
/* 0 intro */
()=>{
  const c=card(`Mission briefing`,`The 4-step recipe`,`
  <p>Every shear/moment problem uses the same 4 steps. Each level of this game is one step for Problem 1:</p>
  <ol><li><b>Reactions</b> – ΣF = 0, ΣM = 0 on the whole beam.</li>
  <li><b>Cut</b> – slice the beam at an arbitrary <i>x</i> in each section and draw the FBD of the left piece.</li>
  <li><b>Equilibrium</b> – ΣF<sub>y</sub>=0 → V(x), ΣM<sub>cut</sub>=0 → M(x).</li>
  <li><b>Plot</b> – sketch V(x) and M(x).</li></ol>
  ${beamSVG()}
  <p class="hint">Sign convention (from the worksheet): on the <b>left</b> piece, positive V points <b>down</b> on the cut face and positive M is <b>counter-clockwise</b>. Upward loads to the left of the cut push V up.</p>`);
  nextBtn(c,"Start");
},
/* 1 reactions */
()=>{
  const c=card(`Level 1 · Step 1`,`Find the support reactions`,`${beamSVG()}
  <p>Pin at A (x=0), roller at B (x=2L), load P at x=L. No horizontal loads, so A<sub>x</sub>=0.</p>
  <div class="eq">ΣM<sub>A</sub> = 0:  B<sub>y</sub>·(2L) − P·(L) = 0</div>`);
  chain(c,[
    ["Solve for B<sub>y</sub>:",["P","P/2","2P","PL"],1,"B<sub>y</sub> = PL / 2L = <b>P/2</b>. Taking moments about A kills A<sub>y</sub> so only one unknown remains."],
    ["Now ΣF<sub>y</sub> = 0: A<sub>y</sub> + B<sub>y</sub> − P = 0. What is A<sub>y</sub>?",["P/2","P","0","−P/2"],0,"A<sub>y</sub> = P − P/2 = <b>P/2</b>. Makes sense — the load is centered, so each support takes half."]
  ]);
},
/* 2 cut 1 */
()=>{
  const c=card(`Level 2 · Steps 2a & 3a`,`Cut in section 1: 0 < x < L`,`
  <p>Drag the cut. Notice the left piece only "sees" A<sub>y</sub> = P/2 — the load P is still to the right of the cut.</p>
  <div id="fbd"></div><input type="range" id="sl" min="0.03" max="0.97" step="0.01" value="0.5">
  <div class="eq">ΣF<sub>y</sub> = 0:  P/2 − V = 0<br>ΣM<sub>cut</sub> = 0:  M − (P/2)·x = 0</div>`);
  const draw=()=>{ const x=+$("#sl").value; $("#fbd").innerHTML=beamSVG({cut:x,showReactions:true,leftOnly:true}); };
  $("#sl").oninput=draw; draw();
  chain(c,[
    ["From ΣF<sub>y</sub>=0, V(x) = ?",["P/2","−P/2","P","Px/2"],0,"V(x) = <b>P/2</b> — constant, because no new force appears between 0 and the cut."],
    ["From ΣM<sub>cut</sub>=0, M(x) = ?  (A<sub>y</sub> is a distance x from the cut)",["P/2","(P/2)x","Px","−(P/2)x + PL"],1,"M(x) = <b>(P/2)x</b> — moment arm grows with x, so M grows linearly. ✔ Matches the worksheet check."]
  ]);
},
/* 3 cut 2 */
()=>{
  const c=card(`Level 3 · Steps 2b & 3b`,`Cut in section 2: L < x < 2L`,`
  <p>Now the left piece includes A<sub>y</sub> <b>and</b> the load P. Drag the cut and watch the distance from P to the cut.</p>
  <div id="fbd"></div><input type="range" id="sl" min="1.03" max="1.97" step="0.01" value="1.5">
  <p id="dist" class="hint"></p>`);
  const draw=()=>{ const x=+$("#sl").value; $("#fbd").innerHTML=beamSVG({cut:x,showReactions:true,leftOnly:true}); $("#dist").innerHTML=`Cut at x = ${x.toFixed(2)}L → distance from P to cut = ${(x-1).toFixed(2)}L`; };
  $("#sl").oninput=draw; draw();
  chain(c,[
    ["What is the moment arm of P about the cut?",["x","L","x − L","2L − x"],2,"P sits at L, the cut at x, so the arm is <b>x − L</b>. This is the key hint in part (e)!"],
    ["ΣF<sub>y</sub>=0: P/2 − P − V = 0 → V(x) = ?",["P/2","−P/2","−P","0"],1,"V(x) = <b>−P/2</b>. Crossing the downward load P made V drop by exactly P."],
    ["ΣM<sub>cut</sub>=0: M − (P/2)x + P(x − L) = 0 → M(x) = ?",["(P/2)x","−(P/2)x + PL","(P/2)x − PL","−Px + PL"],1,"M = (P/2)x − Px + PL = <b>−(P/2)x + PL</b>. ✔ Matches the worksheet check."]
  ]);
},
/* 4 table */
()=>{
  const c=card(`Level 4 · Part (f)`,`Fill the table`,`
  <p>Enter values as decimals in units of <b>P</b> (for V) or <b>PL</b> (for M). Example: P/2 → <code>0.5</code>, −P/2 → <code>-0.5</code>.</p>
  <div class="eq">V = P/2 (0&lt;x&lt;L),  −P/2 (L&lt;x&lt;2L)<br>M = (P/2)x (0&lt;x&lt;L),  −(P/2)x + PL (L&lt;x&lt;2L)</div>
  <table><tr><th>Point</th><th>V [P]</th><th>M [PL]</th></tr>
  ${[["x = 0",.5,0],["x = L⁻",.5,.5],["x = L⁺",-.5,.5],["x = 2L⁻",-.5,0]].map(r=>`<tr><td>${r[0]}</td><td><input data-a="${r[1]}"></td><td><input data-a="${r[2]}"></td></tr>`).join("")}
  </table><button class="primary" id="chk" style="margin-top:10px">Check</button><div class="fb" id="fb"></div>`);
  $("#chk").onclick=()=>{
    let all=true;
    c.querySelectorAll("td input").forEach(i=>{
      const v=parseFloat(i.value.replace("−","-")); const ok=Math.abs(v-+i.dataset.a)<1e-6;
      i.className=ok?"ok":"no"; if(!ok) all=false;
    });
    award(all);
    const fb=$("#fb");
    if(all){ fb.className="fb good"; fb.innerHTML="Perfect! Notice: M(L⁻) = M(L⁺) — moment is continuous, but V jumps by P at the load."; $("#chk").disabled=true; nextBtn(c); }
    else { fb.className="fb bad"; fb.innerHTML="Red boxes are off. Tip: M(L) = (P/2)·L = 0.5 PL. At the roller (2L), M = −(P/2)(2L)+PL = 0."; }
  };
},
/* 5 plot */
()=>{
  const c=card(`Level 5 · Step 4`,`Plot the diagrams`,`
  <p>Drag the cut along the whole beam and watch V and M trace out.</p>
  <input type="range" id="sl" min="0" max="2" step="0.01" value="0">
  <div class="live"><span style="color:var(--v)">V = <b id="lv"></b></span><span style="color:var(--m)">M = <b id="lm"></b></span></div>
  <div id="dv"></div><div id="dm"></div>`);
  const fmt=n=>(Math.abs(n)<1e-9?"0":n.toFixed(2));
  const draw=()=>{ const x=+$("#sl").value;
    $("#dv").innerHTML=diagSVG(V1,"vline","V",2,x,x); $("#dm").innerHTML=diagSVG(M1,"mline","M",2,x,x);
    $("#lv").textContent=(x>=2?"0 (end)":fmt(V1(x))+" P"); $("#lm").textContent=fmt(M1(x))+" PL"; };
  $("#sl").oninput=draw; draw();
  chain(c,[
    ["Is the V diagram made of straight lines or curves?",["Flat (horizontal) lines","Sloped lines","Parabolas"],0,"V is <b>flat</b> between point loads — no distributed load means V doesn't change."],
    ["And the M diagram?",["Flat lines","Straight sloped lines","Parabolas"],1,"M is made of <b>straight sloped lines</b>. Its slope equals V: +P/2 then −P/2."],
    ["Where is M maximum, and what is it?",["x=0, M=0","x=L, M=PL/2","x=2L, M=PL","x=L, M=PL"],1,"M<sub>max</sub> = <b>PL/2 at x = L</b> — exactly where V crosses zero."]
  ]);
},
/* 6 rules */
()=>{
  const c=card(`Level 6`,`Unlock the shortcut rules`,`<p>These patterns let you sketch diagrams <b>without</b> writing equations (Problem 2!).</p>`);
  chain(c,[
    ["At a downward point load P, the V diagram…",["Jumps down by P","Jumps up by P","Stays the same","Has a kink"],0,"<b>Jumps down by P</b> (an upward reaction makes it jump up)."],
    ["The slope of the M diagram equals…",["the load","V","−V","zero"],1,"dM/dx = <b>V</b>. Positive V → M rising; negative V → M falling; V = 0 → M flat."],
    ["At a pin or roller at the END of a beam (no applied moment), M is…",["Max","Zero","Equal to the reaction","Undefined"],1,"<b>M = 0</b> at free pin/roller ends."],
    ["The change in M between two points equals…",["The area under the V diagram","The jump in V","The load","Always zero"],0,"ΔM = <b>area under V</b>. E.g. 0→L: (P/2)·L = PL/2 ✔"]
  ]);
},
/* 7 boss: problem 2 */
()=>{
  const c=card(`Boss level · Problem 2`,`Beam of length 3L, loads P at L and 2L`,`${p2beam()}
  <p>Use only the rules. Pick the shear value in each section.</p>
  <div class="row" id="pick"></div>
  <div id="bv"></div><div id="bm"></div><div class="fb" id="fb"></div>`);
  const opts=["P","P/2","0","−P/2","−P"], vals=[1,.5,0,-.5,-1];
  const ans=[0,2,4]; const sel=[null,null,null];
  const names=["0<x<L","L<x<2L","2L<x<3L"];
  const pick=$("#pick");
  pick.innerHTML=names.map((n,i)=>`<label>${n}: <select data-i="${i}" ><option value="">?</option>${opts.map((o,j)=>`<option value="${j}">${o}</option>`).join("")}</select></label>`).join("")+`<button class="primary" id="go">Check</button>`;
  const Vg=x=>{const s=x<1?0:x<2?1:2; return sel[s]==null?0:vals[sel[s]];};
  const Mg=x=>{let m=0,step=.005;for(let t=0;t<x;t+=step)m+=Vg(t)*step;return m;};
  const draw=()=>{ $("#bv").innerHTML=diagSVG(Vg,"vline","V",3); $("#bm").innerHTML=diagSVG(Mg,"mline","M",3); };
  pick.querySelectorAll("select").forEach(s=>s.onchange=()=>{sel[+s.dataset.i]=s.value===""?null:+s.value; draw();});
  draw();
  $("#go").onclick=()=>{
    const ok=sel.every((s,i)=>s===ans[i]); award(ok); const fb=$("#fb");
    if(ok){ fb.className="fb good"; fb.innerHTML=`Boss defeated! By symmetry A<sub>y</sub> = B<sub>y</sub> = P. V: P → 0 → −P. M rises to <b>PL</b> at x=L, stays flat at PL (V=0) until 2L, then drops back to 0 at 3L.`; $("#go").disabled=true; nextBtn(c,"Finish"); }
    else { fb.className="fb bad"; fb.innerHTML="Check your M diagram — does it end at 0 at the roller? Hint: find reactions by symmetry first, then V jumps down by P at each load."; }
  };
},
/* 8 done */
()=>{
  card(`Complete`,`You finished Beam Quest!`,`<p>Final score: <b>${xp} XP</b></p>
  <p><b>Cheat sheet:</b></p><ul>
  <li>Reactions first (ΣM about a support → one unknown).</li>
  <li>Cut each section at arbitrary x; left piece; ΣF<sub>y</sub> → V, ΣM<sub>cut</sub> → M.</li>
  <li>Point load → V jumps by the load; M gets a kink.</li>
  <li>Slope of M = V. ΔM = area under V. M<sub>max</sub> where V crosses 0.</li>
  <li>M = 0 at simple supports at beam ends.</li></ul>
  <button class="primary" onclick="xp=0;streak=0;award(true);xp=0;streak=0;document.querySelector('#xp').textContent=0;document.querySelector('#streak').textContent=0;go(0)">Play again</button>`);
}
];

function p2beam(){
  const sc=x=>X0+x*180; let s=`<svg viewBox="0 0 ${W} 160"><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="var(--ink)"/></marker></defs>`;
  s+=`<rect class="beam" x="${sc(0)}" y="70" width="540" height="30"/>`;
  s+=`<polygon points="${sc(0)},100 ${sc(0)-16},125 ${sc(0)+16},125" fill="var(--line)" stroke="var(--beamline)"/><polygon points="${sc(3)},100 ${sc(3)-16},125 ${sc(3)+16},125" fill="var(--line)" stroke="var(--beamline)"/>`;
  [1,2].forEach(i=>s+=`<line x1="${sc(i)}" y1="15" x2="${sc(i)}" y2="64" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah2)"/><text class="txt" x="${sc(i)+8}" y="30" font-weight="700">P</text>`);
  ["0","L","2L","3L"].forEach((t,i)=>s+=`<text class="txt" x="${sc(i)-8}" y="145">${t}</text>`);
  return s+`</svg>`;
}

function card(step,title,html){
  stage.innerHTML=""; const c=document.createElement("div"); c.className="card";
  c.innerHTML=`<div class="step">${step}</div><h2>${title}</h2>${html}`; stage.appendChild(c); return c;
}
function go(n){ level=n; $("#bar").style.width=(n/(levels.length-1)*100)+"%"; $("#track").innerHTML=levels.map((_,i)=>`<span class="${i<n?"done":i==n?"now":""}"></span>`).join(""); levels[n](); window.scrollTo(0,0); }
go(0);
</script>
